# punisher code base - CPS-B QS3 (from MAME cps1_v.cpp CPS_B_21_QS3)
codebase: punisher
reference_set: punisher
cpsb:
  layer: 0x12
  palctrl: 0x0c
  masks: [0x14, 0x16, 0x08, 0x0a]
  id_off: 0x0e
  id_val: 0x0c00
  enables: [0x04, 0x02, 0x20]
  unknown: [0x2c]
ignore_insns:
  - {match: 'move\.l #\$800000,\$[0-9a-f]+\(a6\)', note: "16.16 velocity stored in an object, not an address"}
overrides:
  0x01d0b4: {action: ignore, note: "immediate $800000 stored in an object field: bit 23 of a state-flag field, not an address"}
eeprom:
  asm: cb_punisher.s
  hooks:
    - {pc: 0x006d52, label: cb_ee_load}   # after the guard of the $6D48 load routine
    - {pc: 0x006db4, label: cb_ee_save}   # after the guard of the $6DAA save routine
  region: [0x006d52, 0x006f7c]     # replaced bit-bang driver; its I/O sites are dropped
  symbols:
    EE_TRAP: {pc: 0x000a92}        # d0=1 raise IPL, d0=0 lower
# game RAM word the vblank IRQ copies to the CPS-B layer control (-$24d2(a5) -> $800152 at $ACA)
layer_shadow: 0xff5b2e
# priority masks 1-3 the vblank IRQ copies to the CPS-B ($db30-$db34(a5) -> masks 1-3 at $ab2-$ac2)
mask_shadow: 0xff5b30
# asm/cb_punisher.s provides ovl_next_regs (next-frame scroll2 base/scroll for overlays)
next_regs: true
next_regs3: true                # ovl_next_regs3: same for scroll3 (overlays over scroll3)
idle_hook: {pc: 0x0008ce, kind: jmp, label: cb_idle, resume: 0x0008d4}
patches:
  # Work RAM $FFFFF0-$FFFFFF holds the CPS2 object registers on phoenix boards: real
  # hardware does not read them back like RAM, so the games' RAM tests would fail
  # (red screen) and their RAM clears would zero the registers. Every loop over the
  # top of work RAM stops at $FFFFEF (MAME backs those addresses with RAM, so only
  # hardware shows the difference).
  - {pc: 0x0007e2, replace: 0x3ffb, note: "boot RAM clear: stop at $FFFFEF"}
  - {pc: 0x000642, replace: 0xffec, note: "boot RAM test: end at $FFFFEF"}
  - {pc: 0x0012f6, replace: 0xfffff0, note: "game RAM clear: stop at $FFFFEF"}
  - {pc: 0x09e396, replace: 0xffec, note: "service RAM test: end at $FFFFEF"}
