# wof_def code base - CPS-B DEF (from MAME cps1_v.cpp CPS_B_21_DEF)
# Same program structure as the QS1 revision (specs/wof.yaml); addresses for wofr1.
codebase: wof_def
reference_set: wofr1
cpsb:
  layer: 0x26
  palctrl: 0x30
  masks: [0x28, 0x2a, 0x2c, 0x2e]
  id_off: -1
  id_val: 0x0000
  enables: [0x02, 0x04, 0x08]
  unknown: []
eeprom:
  asm: cb_wof.s                    # same driver, image -$7F24(a5), IPL helper $91A
  hooks:
    - {pc: 0x0108da, label: cb_ee_load}   # after the guard of the $108D0 load routine
    - {pc: 0x010938, label: cb_ee_save}   # after the guard of the $1092E save routine
  region: [0x0108da, 0x010afa]     # replaced bit-bang driver ($10AFA: default EEPROM image)
  symbols:
    EE_BUF: {pc: 0x0108e6, disp: true}   # a5 displacement of the image buffer (-$7f24 QS1/DEF, -$7f54 Asia/Japan)
    EE_TRAP: {pc: 0x00091a}
overrides:
  0x00641a: {action: ignore, note: "immediate $800100 loaded into a data register: packed (x,y) parameter pair, not an address"}
  0x00646e: {action: ignore, note: "immediate $f00280 loaded into a data register: packed (x,y) parameter pair, not an address"}
  0x0064d2: {action: ignore, note: "immediate $800100 loaded into a data register: packed (x,y) parameter pair, not an address"}
# game RAM word the vblank IRQ copies to the CPS-B layer control (-$1c68(a5) -> $800166 at $52A)
layer_shadow: 0xff6398
# priority masks 1-3 the vblank IRQ copies to the CPS-B ($e39a-$e39e(a5) -> masks 1-3 at $512-$522)
mask_shadow: 0xff639a
next_regs: true
# $24404 (3P games) scans 38 words of the vblank handler from $506 for bra/nop/jmp
no_jmp: [[0x000506, 0x000552]]
opcode_scans: [{start: 0x000506, words: 38, match: [[0x6000, 0xff00], [0x4e71, 0xffff], [0x4ec0, 0xffc0]]}]
next_regs3: true                # ovl_next_regs3: same for scroll3 (overlays over scroll3)
idle_hook: {pc: 0x000746, kind: jmp, label: cb_idle, resume: 0x00074c}
# late-stage scroll3 animator (object type $0E): its timer runs out at the start of
# a frame and it copies new tiles then, after the list shown with them was converted.
# Which tile groups it copies depends on the scroll3 camera, which its camera object
# (at -$478(a5); cam_pc: its handler entry) moves just before. pc: handler entry.
scroll3_anim: {pc: 0x05183e, label: cb_anim3, cam_pc: 0x018f2e}
data_shadows:
  # vector-table check ($62-$6D) against the original values
  - {pc: 0x007850, reg: a4, src: 0x000062, len: 12}
# pen-mask overlay data (tile blocks, mask values) also from the QS1 revision:
# same game, same graphics ROMs
overlay_data_sets: [wof, wofu, wofj]
patches:
  # Work RAM $FFFFF0-$FFFFFF holds the CPS2 object registers on phoenix boards: real
  # hardware does not read them back like RAM, so the games' RAM tests would fail
  # (red screen) and their RAM clears would zero the registers. Every loop over the
  # top of work RAM stops at $FFFFEF (MAME backs those addresses with RAM, so only
  # hardware shows the difference).
  - {pc: 0x000430, replace: 0x3ffb, note: "boot RAM clear: stop at $FFFFEF"}
  - {pc: 0x00763c, replace: 0xffec, note: "boot RAM test: end at $FFFFEF"}
  - {pc: 0x05fac0, replace: 0xffec, note: "service RAM test: end at $FFFFEF"}
